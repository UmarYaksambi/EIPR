data:
  ai_generated_path: data/ai_generated/
  natural_path: data/natural/
  n_images: 500
  image_size: [512, 512]

watermark:
  n_bits: 64
  seed: 42

ecc:
  scheme: reed_solomon
  # Run --mode calibrate on your real DiffusionDB dataset to get these values.
  # The values below are PLACEHOLDERS — they came from synthetic blurred-noise
  # images and are wrong for real SD output. Re-calibrate before any paper run.
  tau_low: 1.5176
  tau_high: 214.5201
  tau_percentile_low: 25
  tau_percentile_high: 75
  r_high: 0.75
  r_mid: 0.50
  r_low: 0.25

embedding:
  # alpha=8.0 targets mean PSNR >= 40 dB (down from 16.0/28.0).
  # With rate-coupled JND: smooth=4.0, mid=10.0, textured=20.0.
  # Verify on 10 images before the full 500-image run:
  #   python experiment_runner.py --config experiment.yaml --mode smoke_test
  alpha: 8.0
  embed_coeff_indices: [1, 2, 3]
  block_size: 8

attacks:
  jpeg_qualities: [30, 50, 70]
  gaussian_sigmas: [5, 10, 20]
  crop_fractions: [0.05, 0.10]
  rotation_angles: [2.0, 5.0]
  median_ksizes: [3, 5]
  blur_ksizes: [3, 5]
  brightness_deltas: [10, 20]
  regeneration_strengths: [0.3, 0.4, 0.6]
  # Set true only on a CUDA machine with diffusers installed.
  # When true, experiment_runner will hard-crash if SD is unavailable
  # rather than silently substituting the JPEG+noise surrogate.
  require_real_regeneration: true

results:
  output_dir: results/