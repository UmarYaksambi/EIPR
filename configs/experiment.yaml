# configs/experiment.yaml
data:
  ai_generated_path: data/ai_generated/
  natural_path: data/natural/
  n_images: 500
  image_size: [512, 512]

watermark:
  n_bits: 64
  seed: 42

ecc:
  scheme: repetition
  tau_low: 1.5443               
  tau_high: 187.5232
  tau_percentile_low: 25
  tau_percentile_high: 75
  r_high: 0.0
  r_mid: 0.0
  r_low: 0.0

embedding:
  alpha: 36.0
  embed_coeff_indices: [1, 2, 3]
  block_size: 8

# Geometric attacks — scope statement for Table 1
# ------------------------------------------------
# crop, rotation, scale are now successfully included in Table 1 as the Cr-channel
# geometric sync effectively corrects these attacks blindly before QIM extraction.
# Rationale: Block-DCT QIM requires the image grid to be aligned. We embed sync 
# tones in the Cr chroma channel (avoiding QIM collision in Y) to perform 
# Fourier-Mellin affine correction safely at decode time.

attacks:
  jpeg_qualities: [30, 50, 70]
  gaussian_sigmas: [5, 10, 20]
  crop_fractions: [0.05, 0.10]
  rotation_angles: [2.0, 5.0]
  median_ksizes: [3, 5]
  blur_ksizes: [3, 5]
  brightness_deltas: [10, 20]
  regeneration_strengths: [0.3, 0.4, 0.6]

results:
  output_dir: results/